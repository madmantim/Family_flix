services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: familyflix-tailscale
    hostname: familyflix
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=familyflix
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve-config.json
      - TS_USERSPACE=false
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./serve-config.json:/config/serve-config.json:ro
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: familyflix-frontend
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      - tailscale
      - backend

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: familyflix-backend
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY}
      - TMDB_ACCESS_TOKEN=${TMDB_ACCESS_TOKEN}
      - OMDB_API_KEY=${OMDB_API_KEY}
      - DATABASE_URL=sqlite:///data/family_flix.db
    volumes:
      - app-data:/app/data
      - app-static:/app/static

volumes:
  tailscale-state:
  app-data:
  app-static:
